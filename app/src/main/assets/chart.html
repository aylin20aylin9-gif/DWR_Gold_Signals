<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<style>
  html, body { margin:0; padding:0; background:#1a1a1a; height:100%; width:100%; overflow:hidden; }
  #chart { width:100%; height:100%; }
  #status {
    position:absolute; top:0; left:0; right:0; bottom:0;
    display:flex; align-items:center; justify-content:center;
    color:#ffcc00; font-family:sans-serif; font-size:14px;
    text-align:center; padding:12px; box-sizing:border-box;
  }
</style>
</head>
<body>
<div id="chart"></div>
<div id="status">⏳ جاري تحميل الشارت...</div>
<script>
  // نحمّل مكتبة الشارت ديناميكياً مع مصدر بديل (fallback) في حال فشل المصدر الأول
  // (بعض الشبكات تحجب unpkg.com، لذلك نجرب jsdelivr أولاً ثم unpkg كخيار احتياطي)
  var sources = [
    "https://cdn.jsdelivr.net/npm/lightweight-charts@4.1.3/dist/lightweight-charts.standalone.production.js",
    "https://unpkg.com/lightweight-charts@4.1.3/dist/lightweight-charts.standalone.production.js"
  ];
  var srcIndex = 0;

  function showStatus(msg) {
    var el = document.getElementById('status');
    if (el) { el.style.display = 'flex'; el.textContent = msg; }
  }
  function hideStatus() {
    var el = document.getElementById('status');
    if (el) el.style.display = 'none';
  }

  function loadNextSource() {
    if (srcIndex >= sources.length) {
      showStatus('⚠️ تعذر تحميل الشارت. تحقق من اتصال الإنترنت ثم أعد فتح التطبيق.');
      defineFallbackStubs();
      return;
    }
    var s = document.createElement('script');
    s.src = sources[srcIndex];
    s.onload = onLibraryLoaded;
    s.onerror = function () {
      srcIndex++;
      loadNextSource();
    };
    document.body.appendChild(s);
  }

  // دوال احتياطية حتى لا يفشل استدعاء evaluateJavascript من الأندرويد بصمت
  function defineFallbackStubs() {
    window.updateCandles = function () {};
    window.setSignal = function () {};
  }

  var chart, candleSeries, activeLines = [];

  function onLibraryLoaded() {
    if (typeof LightweightCharts === 'undefined') {
      srcIndex++;
      loadNextSource();
      return;
    }
    try {
      chart = LightweightCharts.createChart(document.getElementById('chart'), {
        layout: {
          background: { type: 'solid', color: '#1a1a1a' },
          textColor: '#d1d1d1'
        },
        grid: {
          vertLines: { color: 'rgba(255,255,255,0.06)' },
          horzLines: { color: 'rgba(255,255,255,0.06)' }
        },
        rightPriceScale: { borderColor: 'rgba(255,255,255,0.2)' },
        timeScale: { borderColor: 'rgba(255,255,255,0.2)', timeVisible: true, secondsVisible: false },
        crosshair: { mode: LightweightCharts.CrosshairMode.Normal },
        autoSize: true
      });

      candleSeries = chart.addCandlestickSeries({
        upColor: '#33cc33',
        downColor: '#ff4d4d',
        borderUpColor: '#33cc33',
        borderDownColor: '#ff4d4d',
        wickUpColor: '#33cc33',
        wickDownColor: '#ff4d4d'
      });

      hideStatus();

      window.addEventListener('resize', function () {
        chart.applyOptions({ width: document.getElementById('chart').clientWidth, height: document.getElementById('chart').clientHeight });
      });

      // إن وصلت بيانات من الأندرويد قبل اكتمال تهيئة الشارت، نطبّقها الآن
      if (window.__pendingCandles) {
        updateCandles(window.__pendingCandles);
        window.__pendingCandles = null;
      }
      if (window.__pendingSignal) {
        var p = window.__pendingSignal;
        setSignal(p.type, p.entry, p.sl, p.tp1, p.tp2);
        window.__pendingSignal = null;
      }
    } catch (e) {
      showStatus('⚠️ خطأ في تهيئة الشارت: ' + e.message);
      defineFallbackStubs();
    }
  }

  function clearSignalLines() {
    for (var i = 0; i < activeLines.length; i++) {
      try { candleSeries.removePriceLine(activeLines[i]); } catch (e) {}
    }
    activeLines = [];
  }

  // called from Android with a JSON string: [{time,open,high,low,close}, ...]
  // ملاحظة: lightweight-charts يرفض أي بيانات غير مرتبة تصاعدياً حسب الوقت (وتويلف داتا
  // بترجع الشموع الأحدث أولاً)، لذلك نرتب وننظف البيانات هنا دائماً قبل عرضها كخط دفاع أخير
  window.updateCandles = function (jsonStr) {
    if (!candleSeries) { window.__pendingCandles = jsonStr; return; }
    try {
      var data = JSON.parse(jsonStr);

      // ترتيب تصاعدي حسب الوقت
      data.sort(function (a, b) { return a.time - b.time; });

      // إزالة أي تكرار لنفس التوقيت (يسبب رفض setData أيضاً)
      var clean = [];
      var lastTime = null;
      for (var i = 0; i < data.length; i++) {
        if (data[i].time !== lastTime) {
          clean.push(data[i]);
          lastTime = data[i].time;
        }
      }

      candleSeries.setData(clean);
      chart.timeScale().scrollToRealTime();
      hideStatus();
    } catch (e) {
      showStatus('⚠️ خطأ في عرض بيانات الشارت: ' + e.message);
    }
  };

  // type: 'buy' | 'sell' | 'none'
  window.setSignal = function (type, entry, sl, tp1, tp2) {
    if (!candleSeries) { window.__pendingSignal = { type: type, entry: entry, sl: sl, tp1: tp1, tp2: tp2 }; return; }
    clearSignalLines();
    if (type === 'none') return;

    activeLines.push(candleSeries.createPriceLine({
      price: entry, color: '#ffffff', lineWidth: 2,
      lineStyle: LightweightCharts.LineStyle.Dashed, axisLabelVisible: true, title: 'دخول'
    }));
    activeLines.push(candleSeries.createPriceLine({
      price: sl, color: '#ff3333', lineWidth: 2,
      lineStyle: LightweightCharts.LineStyle.Solid, axisLabelVisible: true, title: 'وقف الخسارة'
    }));
    activeLines.push(candleSeries.createPriceLine({
      price: tp1, color: '#33cc33', lineWidth: 2,
      lineStyle: LightweightCharts.LineStyle.Solid, axisLabelVisible: true, title: 'هدف 1'
    }));
    activeLines.push(candleSeries.createPriceLine({
      price: tp2, color: '#00ff88', lineWidth: 1,
      lineStyle: LightweightCharts.LineStyle.Dotted, axisLabelVisible: true, title: 'هدف 2'
    }));
  };

  loadNextSource();
</script>
</body>
</html>
